<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veltrix Tires | Launch Control</title><style>:root{font-family:Inter,Arial,sans-serif;color:#171717;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#111;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}header span{color:#f34a52}main{max-width:1200px;margin:auto;padding:28px 18px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button{border:1px solid #ddd;border-radius:7px;padding:10px 15px;background:white;cursor:pointer;font-weight:600}button.active,.primary{background:#d7192b;color:white;border-color:#d7192b}.danger{color:#bd1524}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e1e3e8;border-radius:10px;padding:20px;margin-bottom:15px}.metric{font-size:32px;font-weight:800;margin:8px 0}.muted{color:#656a72;font-size:13px}.status{font-size:12px;font-weight:700;border-radius:30px;padding:5px 9px;background:#f0f1f3}.ready{color:#177344;background:#e6f4ea}.blocked{color:#a41b2b;background:#ffe8ea}.attention{color:#8b5a0a;background:#fff3d9}h1{margin:0 0 5px}h2{font-size:20px}h3{font-size:15px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd0d6;border-radius:6px;font:inherit}textarea{min-height:95px}section[hidden]{display:none}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:13px 0}.line:last-child{border:0}.line>div{flex:1}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.tag{display:inline-block;background:#f4f4f5;padding:5px 8px;border-radius:4px;margin:4px;font-size:12px}.notice{border-left:4px solid #d7192b;background:#fff7f7;padding:14px;margin:15px 0}.drop{border:2px dashed #c5c8cf;border-radius:8px;padding:24px;text-align:center}.small{font-size:12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}@media(max-width:600px){header{display:block}.line{align-items:flex-start;flex-direction:column}.line select{max-width:100%}}</style></head><body><header><b>VELTRIX <span>TIRES</span> <small> / LAUNCH CONTROL</small></b><div class="small">PRIVATE WORKSPACE · LOCAL DATA</div></header><main><h1>Storefront Go-Live</h1><p class="muted">Deployment planning and approval for veltrixtires.com. No hosting, DNS, SSL, billing, or live-site changes are executed by this app.</p><nav id="nav"></nav><div id="content"></div></main><script>
const defaults={environment:{domain:'veltrixtires.com',siteUrl:'https://veltrixtires.com',repo:'',branch:'main',source:'',hostinger:'',deployUrl:'',dnsProvider:'',sslIssuer:'',owner:''},steps:[['GitHub repository identified','Source control'],['Production branch and commit verified','Source control'],['Site build package uploaded and inspected','Build'],['Build command and output directory confirmed','Build'],['Hostinger hosting target verified','Hosting'],['Deployment tested in staging','Hosting'],['Domain ownership and connection verified','Domain'],['DNS A/CNAME records independently verified','Domain'],['SSL certificate and HTTPS verified','Security'],['HTTPS redirect and www behavior tested','Security'],['Storefront pages and mobile navigation tested','QA'],['Catalog, cart, checkout and payment flow tested safely','QA'],['Inventory, pricing and shipping settings reviewed','QA'],['Backup and rollback package verified','Rollback'],['Launch report reviewed and final approval recorded','Approval']].map((x,i)=>({id:i+1,title:x[0],group:x[1],status:'attention',note:''})),files:[],notes:'',rollback:'',proposals:[],approval:{approved:false,by:'',at:'',note:''}};
let state;try{state=JSON.parse(localStorage.getItem('veltrix_launch_v1'))||structuredClone(defaults)}catch{state=structuredClone(defaults)};const save=()=>localStorage.setItem('veltrix_launch_v1',JSON.stringify(state));let tab='Dashboard';const tabs=['Dashboard','Environment','Checklist','Build files','Review','Approval','Report'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const statuses=['attention','ready','blocked'];const badge=s=>`<span class="status ${s}">${s==='attention'?'Needs attention':s==='ready'?'Ready':'Blocked'}</span>`;const summary=()=>({ready:state.steps.filter(s=>s.status==='ready').length,blocked:state.steps.filter(s=>s.status==='blocked').length,attention:state.steps.filter(s=>s.status==='attention').length});const problems=()=>{let p=[];for(const [key,label] of [['repo','GitHub repository'],['source','Build source'],['hostinger','Hostinger target'],['dnsProvider','DNS provider'],['sslIssuer','SSL certificate verification']])if(!state.environment[key].trim())p.push(label+' is missing');if(!/^https:\/\//i.test(state.environment.siteUrl))p.push('Site URL must use HTTPS');if(!state.files.length)p.push('No build package recorded');return p};const allReady=()=>summary().ready===state.steps.length&&!problems().length;
function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let html='';let m=summary();if(tab==='Dashboard')html=`<div class="grid"><div class="card"><div class="muted">Completed checks</div><div class="metric">${m.ready}/${state.steps.length}</div>${badge(m.ready===state.steps.length?'ready':'attention')}</div><div class="card"><div class="muted">Blocked checks</div><div class="metric">${m.blocked}</div>${badge(m.blocked?'blocked':'ready')}</div><div class="card"><div class="muted">Needs attention</div><div class="metric">${m.attention+problems().length}</div>${badge('attention')}</div><div class="card"><div class="muted">Production approval</div><div class="metric" style="font-size:21px">${state.approval.approved?'Recorded':'Not approved'}</div>${badge(state.approval.approved?'ready':'attention')}</div></div><div class="panel"><h2>Deployment overview</h2><p><b>Domain:</b> ${esc(state.environment.domain)}<br><b>Repository:</b> ${esc(state.environment.repo)||'Not configured'}<br><b>Hostinger:</b> ${esc(state.environment.hostinger)||'Not configured'}</p><div class="notice">This dashboard displays user-entered evidence only. DNS, SSL, GitHub, and Hostinger are not automatically checked or changed.</div></div>`;
if(tab==='Environment'){let fields=[['domain','Storefront domain'],['siteUrl','Current site URL'],['repo','GitHub repository URL'],['branch','Deployment branch'],['source','Build source / commit / artifact'],['hostinger','Hostinger hosting target / site ID'],['deployUrl','Staging or deployment preview URL'],['dnsProvider','DNS provider and verified record summary'],['sslIssuer','SSL issuer, expiration and verification notes'],['owner','Launch reviewer / owner']];html=`<div class="panel"><h2>Environment configuration</h2><div class="two">${fields.map(([k,l])=>`<div><label for="${k}">${l}</label><input id="${k}" data-env="${k}" value="${esc(state.environment[k])}" placeholder="Enter verified value"></div>`).join('')}</div><p class="muted">Values are saved in this browser only. Do not enter passwords, API tokens or private keys.</p></div>`}
if(tab==='Checklist')html=`<div class="panel"><h2>Production launch checklist</h2>${state.steps.map(s=>`<div class="line"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.group)}</div><input aria-label="Evidence for ${esc(s.title)}" data-note="${s.id}" value="${esc(s.note)}" placeholder="Evidence, test result or blocker"></div><select aria-label="Status" data-step="${s.id}">${statuses.map(v=>`<option value="${v}" ${v===s.status?'selected':''}>${v==='attention'?'Needs attention':v==='ready'?'Ready':'Blocked'}</option>`).join('')}</select></div>`).join('')}</div>`;
if(tab==='Build files')html=`<div class="panel"><h2>Build package intake</h2><div class="drop"><p>Choose ZIP, HTML, CSS, JavaScript, JSON or other site files</p><input id="files" type="file" multiple accept=".zip,.html,.css,.js,.json,.txt,.svg,.png,.jpg,.webp,.tar,.gz"></div><p class="muted">For privacy and browser limitations, only filenames, sizes and timestamps are recorded. The actual file bytes are not uploaded or stored by this standalone app.</p>${state.files.map((f,i)=>`<div class="line"><div><b>${esc(f.name)}</b><div class="muted">${(f.size/1024).toFixed(1)} KB · ${esc(f.at)}</div></div><button data-remove="${i}">Remove</button></div>`).join('')}</div>`;
if(tab==='Review')html=`<div class="panel"><h2>Readiness review</h2><h3>Configuration validation</h3>${problems().length?problems().map(p=>`<div class="line"><div>${esc(p)}</div>${badge('blocked')}</div>`).join(''):`<p>${badge('ready')} Required configuration fields are populated; independent verification is still required.</p>`}<h3>Checklist status</h3>${state.steps.map(s=>`<div class="line"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.note)||'No evidence supplied'}</div></div>${badge(s.status)}</div>`).join('')}</div><div class="panel"><h2>Proposed production changes</h2><label>Proposed change (review only)</label><textarea id="proposal" placeholder="Describe proposed hosting, DNS, SSL or deployment change; include expected effect and rollback"></textarea><button id="addProposal">Add proposal for review</button>${state.proposals.map((p,i)=>`<div class="line"><div>${esc(p)}</div><button data-delproposal="${i}">Remove</button></div>`).join('')}<p class="muted">No proposal is applied automatically.</p></div>`;
if(tab==='Approval')html=`<div class="panel"><h2>Final approval gate</h2><p>${allReady()?badge('ready'):badge('blocked')} ${allReady()?'All recorded readiness conditions are met.':'Approval is blocked until every checklist item is ready and required configuration is supplied.'}</p><label>Approver</label><input id="approver" value="${esc(state.approval.by)}"><label>Approval notes</label><textarea id="approvalNote">${esc(state.approval.note)}</textarea><div class="actions"><button class="primary" id="approve" ${allReady()?'':'disabled'}>Record final approval</button><button id="revoke" class="danger">Revoke approval</button></div><p class="muted">Approval is a local audit record, not authorization for this app to execute deployment or change production settings.</p><p>Last approval: ${esc(state.approval.at)||'None'}</p></div>`;
if(tab==='Report')html=`<div class="panel"><h2>Deployment notes</h2><textarea id="notes" placeholder="Release version, deployment procedure, smoke test outcomes">${esc(state.notes)}</textarea><h2>Rollback checklist</h2><textarea id="rollback" placeholder="Backup location, last known good release, rollback procedure, DNS reversal plan, owner, verification">${esc(state.rollback)}</textarea><div class="actions"><button class="primary" id="export">Export launch report (.json)</button><button id="exportText">Export readable report (.txt)</button></div><p class="muted">Reports include entered environment data, file metadata, checks, proposals, approval and rollback notes.</p></div>`;
document.getElementById('content').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-env]').forEach(e=>e.onchange=()=>{state.environment[e.dataset.env]=e.value;invalidate();save()});document.querySelectorAll('[data-step]').forEach(e=>e.onchange=()=>{state.steps.find(s=>s.id==e.dataset.step).status=e.value;invalidate();save();render()});document.querySelectorAll('[data-note]').forEach(e=>e.onchange=()=>{state.steps.find(s=>s.id==e.dataset.note).note=e.value;invalidate();save()});document.getElementById('files')?.addEventListener('change',e=>{for(const f of e.target.files)state.files.push({name:f.name,size:f.size,at:new Date().toISOString()});invalidate();save();render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.files.splice(+e.dataset.remove,1);invalidate();save();render()});document.getElementById('addProposal')?.addEventListener('click',()=>{let v=document.getElementById('proposal').value.trim();if(v){state.proposals.push(v);invalidate();save();render()}});document.querySelectorAll('[data-delproposal]').forEach(e=>e.onclick=()=>{state.proposals.splice(+e.dataset.delproposal,1);invalidate();save();render()});document.getElementById('approve')?.addEventListener('click',()=>{let by=document.getElementById('approver').value.trim();if(!by)return alert('Enter the approver name.');state.approval={approved:true,by,at:new Date().toISOString(),note:document.getElementById('approvalNote').value};save();render()});document.getElementById('revoke')?.addEventListener('click',()=>{state.approval.approved=false;state.approval.at='';save();render()});for(let k of ['notes','rollback'])document.getElementById(k)?.addEventListener('change',e=>{state[k]=e.target.value;save()});document.getElementById('export')?.addEventListener('click',()=>download(JSON.stringify({generatedAt:new Date().toISOString(),readiness:summary(),configurationWarnings:problems(),...state},null,2),'veltrix-launch-report.json','application/json'));document.getElementById('exportText')?.addEventListener('click',()=>download(['VELTRIX TIRES LAUNCH REPORT','Generated: '+new Date().toISOString(),'Domain: '+state.environment.domain,'Site: '+state.environment.siteUrl,'Repository: '+state.environment.repo,'Hostinger: '+state.environment.hostinger,'Approval: '+(state.approval.approved?'Recorded':'Not approved'),'','CONFIGURATION WARNINGS',...problems(),'','CHECKLIST',...state.steps.map(s=>`${s.status.toUpperCase()} | ${s.title} | ${s.note}`),'','PROPOSED CHANGES',...state.proposals,'','DEPLOYMENT NOTES',state.notes,'','ROLLBACK',state.rollback].join('\n'),'veltrix-launch-report.txt','text/plain'))}
function invalidate(){state.approval.approved=false;state.approval.at=''}function download(content,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();</script></body></html>
